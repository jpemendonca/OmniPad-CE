<!DOCTYPE html>
<!-- Source of dashboard-mockup.png. Regenerate with:
     node tools/screenshot_dashboard.mjs file:///<repo>/docs/images/mockup.html docs/images/dashboard-mockup.png 1600 1000 en -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OmniPad CE dashboard mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 1000px; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8edf5;
      background:
        radial-gradient(900px 500px at 78% 8%, rgba(79, 140, 255, 0.22), transparent 70%),
        radial-gradient(700px 500px at 10% 95%, rgba(45, 212, 160, 0.10), transparent 70%),
        linear-gradient(180deg, #0b1020 0%, #070a12 100%);
      position: relative;
    }
    body::before {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%);
    }
    .head { position: absolute; left: 0; right: 0; top: 56px; text-align: center; }
    .head h1 { font-size: 52px; font-weight: 800; letter-spacing: -1px; }
    .head h1 span { background: linear-gradient(135deg, #7fb0ff, #4f8cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .head p { margin-top: 12px; font-size: 20px; color: #9aa6b8; }
    .tags { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
    .tags span { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(79, 140, 255, 0.12); color: #b9d1ff; border: 1px solid rgba(79, 140, 255, 0.3); }

    .browser { position: absolute; left: 150px; top: 280px; width: 1040px; height: 660px; border-radius: 14px; overflow: hidden;
      background: #0d1320; border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4); }
    .bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #151c2c; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
    .url { margin-left: 14px; flex: 1; height: 26px; border-radius: 7px; background: #0b1020; color: #8a96a8; font-size: 13px; display: flex; align-items: center; padding: 0 12px; font-family: ui-monospace, Consolas, monospace; }
    .browser img { display: block; width: 100%; height: calc(100% - 42px); object-fit: cover; object-position: top; }

    .phone { position: absolute; left: 1120px; top: 330px; width: 300px; height: 620px; border-radius: 44px; padding: 12px;
      background: #1b2233; border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 0 0 2px #0a0e17; }
    .phone .screen { width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: #080b12; position: relative; }
    .phone .screen img { width: 100%; display: block; margin-top: 36px; }
    .phone .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 92px; height: 24px; border-radius: 14px; background: #05070c; }
  </style>
</head>
<body>
  <div class="head">
    <h1>OmniPad CE <span>Dashboard</span></h1>
    <p>Live controller test, connection health and logs, from any browser on your network</p>
    <div class="tags"><span>Real-time button view</span><span>Reports &amp; injections per second</span><span>Live log</span><span>PT / EN</span></div>
  </div>

  <div class="browser">
    <div class="bar"><i></i><i></i><i></i><div class="url">http://&lt;PS5_IP&gt;:8095/</div></div>
    <img src="dashboard.png" alt="">
  </div>

  <div class="phone">
    <div class="screen"><img src="dashboard-mobile.png" alt=""><div class="notch"></div></div>
  </div>
</body>
</html>
