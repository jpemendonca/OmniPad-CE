<!DOCTYPE html>
<html lang="en" data-theme="light" manifest="/omnipad.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniPad CE</title>
<script>
  /* The theme chosen on the dashboard; light is the default */
  try { document.documentElement.dataset.theme = localStorage.getItem('omnipad.theme') === 'dark' ? 'dark' : 'light'; } catch (e) { /* private mode */ }
</script>
<style>
  :root, [data-theme="light"] {
    --bg: #eef1f6; --panel: #ffffff; --line: rgba(15, 23, 42, 0.08); --line-strong: rgba(15, 23, 42, 0.16);
    --text: #0f172a; --muted: #5b6678; --accent: #2563eb; --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 16px rgba(15, 23, 42, 0.05);
  }
  [data-theme="dark"] {
    --bg: #080b12; --panel: #111827; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.16);
    --text: #e8edf5; --muted: #8a96a8; --accent: #4f8cff; --on-accent: #080b12;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-size: 26px; line-height: 1.45; text-align: center; }
  main { width: 100%; max-width: 980px; padding: 40px 32px; }
  svg { width: 132px; height: 132px; }
  h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.5px; margin: 14px 0 10px; }
  .m { font-size: 38px; font-weight: 700; margin-bottom: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 32px;
    margin: 0 auto 26px; max-width: 820px; text-align: start; }
  ol { list-style: none; counter-reset: s; }
  li { counter-increment: s; display: flex; align-items: center; gap: 20px; margin-bottom: 18px; font-weight: 600; }
  li:last-child { margin-bottom: 0; }
  li::before { content: counter(s); flex: none; width: 56px; height: 56px; line-height: 56px; border-radius: 50%; text-align: center;
    font-weight: 800; color: var(--on-accent); background: var(--accent); }
  .hint { color: var(--muted); font-size: 22px; margin-bottom: 28px; }
  a.btn { display: inline-block; min-width: 300px; padding: 20px 36px; border-radius: 14px; font-weight: 700; text-decoration: none;
    color: var(--on-accent); background: var(--accent); }
  a.btn:focus { outline: 5px solid var(--text); outline-offset: 4px; }
  .spin { width: 56px; height: 56px; margin: 12px auto; border-radius: 50%; border: 7px solid var(--line-strong); border-top-color: var(--accent);
    animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    body { font-size: 17px; } main { padding: 24px 16px; } svg { width: 88px; height: 88px; } h1 { font-size: 36px; } .m { font-size: 24px; }
    .card { padding: 18px; } li { gap: 14px; } li::before { width: 40px; height: 40px; line-height: 40px; } .hint { font-size: 15px; }
    a.btn { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 -960 960 960" aria-hidden="true"><rect y="-960" width="960" height="960" rx="200" fill="#1a46d4"/><path fill="#fff" d="M147-200q-38 0-59.5-25.5T72-296l48-335q8-53 49.5-91t94.5-38h433q53 0 94.5 38t49.5 91l47 335q6 45-15.5 70.5T813-200q-23 0-39-7.5T747-226L643-330H317L213-226q-11 11-27 18.5t-39 7.5Zm553-240q16 0 28-12t12-28q0-16-12-28t-28-12q-16 0-28 12t-12 28q0 16 12 28t28 12Zm-85-130q16 0 28-12t12-28q0-16-12-28t-28-12q-16 0-28 12t-12 28q0 16 12 28t28 12Zm-315 50v50q0 11 7 18t18 7q11 0 18-7t7-18v-50h50q11 0 18-7t7-18q0-11-7-18t-18-7h-50v-50q0-11-7-18t-18-7q-11 0-18 7t-7 18v50h-50q-11 0-18 7t-7 18q0 11 7 18t18 7h50Z"/></svg>
  <h1>OmniPad CE</h1>
  <div id="checking"><div class="spin"></div><p class="m" data-t="checking"></p></div>
  <div id="off" hidden>
    <p class="m" data-t="notRunning"></p>
    <div class="card"><ol><li data-t="step1"></li><li data-t="step2"></li></ol></div>
    <p class="hint" data-t="auto"></p>
    <a class="btn" id="retry" href="/start" tabindex="1" data-t="retry"></a>
  </div>
</main>
<script>
'use strict';
const I18N = {
  pt: {
    checking: 'Abrindo o OmniPad…', notRunning: 'O OmniPad não está rodando',
    step1: 'Mande o OmniPad-CE.elf pelo seu carregador de payload e inicie (Launch).', step2: 'Abra este ícone de novo.',
    auto: 'Esta página abre o painel sozinha assim que o OmniPad responder.', retry: 'Tentar de novo',
  },
  en: {
    checking: 'Opening OmniPad…', notRunning: 'OmniPad is not running',
    step1: 'Send OmniPad-CE.elf with your payload loader and start it (Launch).', step2: 'Open this icon again.',
    auto: 'This page opens the dashboard by itself as soon as OmniPad answers.', retry: 'Try again',
  },
  es: {
    checking: 'Abriendo OmniPad…', notRunning: 'OmniPad no se está ejecutando',
    step1: 'Envía OmniPad-CE.elf con tu cargador de payloads e inícialo (Launch).', step2: 'Vuelve a abrir este icono.',
    auto: 'Esta página abre el panel sola en cuanto OmniPad responda.', retry: 'Reintentar',
  },
  fr: {
    checking: 'Ouverture d’OmniPad…', notRunning: 'OmniPad n’est pas lancé',
    step1: 'Envoyez OmniPad-CE.elf avec votre chargeur de payload et lancez-le (Launch).', step2: 'Rouvrez cette icône.',
    auto: 'Cette page ouvre le panneau d’elle-même dès qu’OmniPad répond.', retry: 'Réessayer',
  },
  de: {
    checking: 'OmniPad wird geöffnet…', notRunning: 'OmniPad läuft nicht',
    step1: 'Sende OmniPad-CE.elf mit deinem Payload-Loader und starte es (Launch).', step2: 'Öffne dieses Symbol erneut.',
    auto: 'Diese Seite öffnet die Übersicht von selbst, sobald OmniPad antwortet.', retry: 'Erneut versuchen',
  },
  ru: {
    checking: 'Открываем OmniPad…', notRunning: 'OmniPad не запущен',
    step1: 'Отправьте OmniPad-CE.elf через загрузчик payload и запустите его (Launch).', step2: 'Снова откройте этот значок.',
    auto: 'Эта страница сама откроет панель, как только OmniPad ответит.', retry: 'Повторить',
  },
  ja: {
    checking: 'OmniPad を開いています…', notRunning: 'OmniPad が起動していません',
    step1: 'ペイロードローダーで OmniPad-CE.elf を送信して起動（Launch）してください。', step2: 'もう一度このアイコンを開いてください。',
    auto: 'OmniPad が応答すると、このページが自動でパネルを開きます。', retry: '再試行',
  },
};
/* The browser keeps this page (AppCache), so the Media tab icon shows it even when OmniPad is not
 * running. It asks the payload in two ways at once, an XHR and an image: the console's browser
 * lets different kinds of request through in different situations. The first answer opens the
 * dashboard. */
const PANEL = 'http://127.0.0.1:8105/?tv=1', PING = 'http://127.0.0.1:8105/ping';
let lang = '';
try { lang = localStorage.getItem('omnipad.lang') || ''; } catch (e) { /* private mode */ }
if (!I18N[lang]) lang = I18N[(navigator.language || '').slice(0, 2)] ? navigator.language.slice(0, 2) : 'en';
document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = I18N[lang][el.dataset.t]; });

let done = false, round = 0, timer = 0, shown = false;
const $ = (id) => document.getElementById(id);
function openPanel() {
  if (done) return;
  done = true;
  clearTimeout(timer);
  location.replace(PANEL);
}
function check() {
  const mine = ++round;
  let pending = 2, over = false, limit = 0;
  const finish = () => {
    if (over || mine !== round || done) return;
    over = true;
    clearTimeout(limit);
    if (!shown) { shown = true; $('checking').hidden = true; $('off').hidden = false; $('retry').focus(); }
    timer = setTimeout(check, 4000);
  };
  const failed = () => { if (--pending <= 0) finish(); };
  const t = '?t=' + Date.now();
  try {
    const x = new XMLHttpRequest();
    x.open('GET', PING + t, true);
    x.timeout = 3000;
    x.onload = () => (x.status === 200 && String(x.responseText).indexOf('omnipad-ok') >= 0 ? openPanel() : failed());
    x.onerror = x.ontimeout = failed;
    x.send();
  } catch (e) { failed(); }
  const img = new Image();
  img.onload = openPanel;
  img.onerror = failed;
  img.src = PING + '.gif' + t;
  limit = setTimeout(finish, 3500);
}
$('retry').onclick = (e) => {
  e.preventDefault();
  clearTimeout(timer);
  shown = false;
  $('off').hidden = true;
  $('checking').hidden = false;
  check();
};
check();
</script>
</body>
</html>
