<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>OmniPad PS5</title>
  <script>
    /* Apply the saved theme before first paint; light is the default */
    try { document.documentElement.dataset.theme = localStorage.getItem('omnipad.theme') === 'dark' ? 'dark' : 'light'; } catch (e) { /* private mode */ }
  </script>
  <style>
    :root {
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --tri: #1fb57a;
      --cir: #e5484d;
      --crs: #3b82f6;
      --sqr: #d6409f;
    }
    :root, [data-theme="light"] {
      --bg: #eef1f6;
      --panel: #ffffff;
      --panel-2: #f5f7fb;
      --line: rgba(15, 23, 42, 0.08);
      --line-strong: rgba(15, 23, 42, 0.16);
      --hover: rgba(15, 23, 42, 0.32);
      --text: #0f172a;
      --muted: #5b6678;
      --faint: #94a0b2;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-text: #1d4ed8;
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.10);
      --warn: #b45309;
      --warn-soft: rgba(217, 119, 6, 0.10);
      --bad: #dc2626;
      --bad-soft: rgba(220, 38, 38, 0.08);
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 16px rgba(15, 23, 42, 0.05);
      /* controller */
      --pad-shell: #ffffff;
      --pad-shell-edge: #c3ccd9;
      --pad-core-edge: #c3ccd9;
      --pad-touch: #f3f5f9;
      --pad-key: #eef1f6;
      --pad-key-edge: #c3ccd9;
      --pad-glyph: #8a94a6;
      --pad-well: #e9edf3;
      --pad-cap: #f7f9fc;
      --pad-cap-ring: #b9c2d0;
      --pad-core-key: #eef1f6;
      --pad-trig: #e4e8ef;
      --pad-label: #7a8496;
      --log-bg: #f8fafc;
      --log-text: #1e293b;
    }
    [data-theme="dark"] {
      --bg: #080b12;
      --panel: #111827;
      --panel-2: #0d1320;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --hover: rgba(255, 255, 255, 0.32);
      --text: #e8edf5;
      --muted: #8a96a8;
      --faint: #5b6678;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.16);
      --accent-text: #b9d1ff;
      --ok: #2dd4a0;
      --ok-soft: rgba(45, 212, 160, 0.14);
      --warn: #f5b443;
      --warn-soft: rgba(245, 180, 67, 0.14);
      --bad: #f26d6d;
      --bad-soft: rgba(242, 109, 109, 0.14);
      --shadow: none;
      --pad-shell: #1c2433;
      --pad-shell-edge: #34405a;
      --pad-core-edge: #34405a;
      --pad-touch: #222c3e;
      --pad-key: #273246;
      --pad-key-edge: #3a4762;
      --pad-glyph: #7d8aa3;
      --pad-well: #141b28;
      --pad-cap: #2b3448;
      --pad-cap-ring: #3c4762;
      --pad-core-key: #273246;
      --pad-trig: #1a2130;
      --pad-label: #6b7790;
      --log-bg: #0d1320;
      --log-text: #c3ccda;
      --tri: #3ddc97;
      --cir: #ff6b6b;
      --crs: #5aa9ff;
      --sqr: #f78fd0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
    button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button:hover { border-color: var(--hover); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: default; transform: none; }
    button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-soft); }
    button.ghost { background: transparent; }
    input[type=search] { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; min-height: 38px; width: 100%; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .brand .ver { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
    .led.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .led.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .led.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .seg { display: inline-flex; gap: 4px; }
    .seg button { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .seg button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
    .seg svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .banner { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); font-size: 13px; }
    .banner.show { display: block; }

    /* Slot cards */
    .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .slot { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 92px; font-weight: 400; }
    .slot[aria-selected=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
    .slot .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .slot .pl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
    .slot .nm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot.free .nm { color: var(--faint); font-weight: 600; }
    .slot .pl .short { display: none; }

    /* Main tester */
    .main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
    .panel h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pad-wrap { position: relative; }
    .pad-wrap.idle svg.pad { opacity: 0.45; }
    .pad-hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; padding: 24px; }
    .pad-wrap.idle .pad-hint { display: flex; }
    svg.pad { width: 100%; height: auto; display: block; }

    /* DualSense drawing */
    .pad .shell { fill: var(--pad-shell); stroke: var(--pad-shell-edge); stroke-width: 2; }
    .pad .touch { fill: var(--pad-touch); stroke: var(--pad-shell-edge); stroke-width: 1.5; transition: fill 60ms; }
    .pad .touch.on { fill: var(--accent-soft); stroke: var(--accent); }
    .pad .lightbar { fill: none; stroke: var(--pad-shell-edge); stroke-width: 3; stroke-linecap: round; transition: stroke 200ms; }
    .pad .lightbar.lit { stroke: var(--accent); filter: drop-shadow(0 0 3px var(--accent)); }
    .pad .key { fill: var(--pad-key); stroke: var(--pad-key-edge); stroke-width: 1.5; stroke-linejoin: round; transition: fill 60ms; }
    .pad .key.on { fill: var(--accent); stroke: var(--accent); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent)); }
    .pad .ckey { fill: var(--pad-core-key); stroke: var(--pad-core-edge); stroke-width: 1.5; transition: fill 60ms; }
    .pad .ckey.on { fill: var(--accent); stroke: var(--accent); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent)); }
    .pad .glyph { fill: none; stroke: var(--pad-glyph); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transition: stroke 60ms; }
    .pad .face.on .glyph { stroke: #fff; }
    .pad #k-tri.on { fill: var(--tri); stroke: var(--tri); } .pad #k-cir.on { fill: var(--cir); stroke: var(--cir); }
    .pad #k-crs.on { fill: var(--crs); stroke: var(--crs); } .pad #k-sqr.on { fill: var(--sqr); stroke: var(--sqr); }
    .pad .well { fill: var(--pad-well); stroke: var(--pad-core-edge); stroke-width: 1.5; }
    .pad .cap { fill: var(--pad-cap); stroke: var(--pad-cap-ring); stroke-width: 2; transition: fill 60ms; }
    .pad .cap-ring { fill: none; stroke: var(--pad-cap-ring); stroke-width: 1.5; }
    .pad .stick.on .cap { fill: var(--accent); stroke: var(--accent); }
    .pad .trig-bg { fill: var(--pad-trig); stroke: var(--pad-shell-edge); stroke-width: 1.5; }
    .pad .trig-fill { fill: var(--accent); }
    .pad .lbl { fill: var(--pad-label); font-size: 10px; font-weight: 700; font-family: inherit; text-anchor: middle; pointer-events: none; }
    .pad .ps-glyph { fill: none; stroke: var(--pad-glyph); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .pad .ckey.on + .ps-glyph { stroke: #fff; }

    .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .stickbox { display: flex; gap: 12px; align-items: center; }
    .stickbox svg { width: 84px; height: 84px; flex: none; }
    .stickbox .ring { fill: var(--panel-2); stroke: var(--line-strong); stroke-width: 1.5; }
    .stickbox .cross { stroke: var(--line-strong); stroke-width: 1; }
    .stickbox .dot { fill: var(--accent); }
    .kv { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }
    .kv b { color: var(--text); font-weight: 600; }
    .bar { height: 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 40ms linear; }
    .trig { display: grid; grid-template-columns: 28px 1fr 34px; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; margin-top: 12px; }
    .chip { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .chips .none { font-size: 12px; color: var(--faint); align-self: center; }

    /* Health */
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
    .stat .k { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v small { font-size: 12px; color: var(--muted); font-weight: 600; }
    .stat.wide { grid-column: 1 / -1; }
    .v.ok { color: var(--ok); } .v.warn { color: var(--warn); } .v.bad { color: var(--bad); }
    .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .note.warn { color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

    /* Log */
    .log-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .log-tools .grow { flex: 1 1 200px; }
    .quick button { min-height: 32px; padding: 4px 10px; font-size: 12px; }
    .quick button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
    pre.log { font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--log-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--log-text); }
    pre.log .w { color: var(--warn); } pre.log .e { color: var(--bad); } pre.log .g { color: var(--ok); } pre.log .t { color: var(--faint); }

    footer { margin-top: 20px; color: var(--faint); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }

    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .wrap { padding: 12px; }
      .slots { gap: 6px; }
      .slot { min-height: 0; padding: 9px 10px; gap: 3px; }
      .slot .sub, .slot .pl .long { display: none; }
      .slot .pl .short { display: inline; }
      .slot .nm { font-size: 13px; }
      .stickbox { flex-direction: column; align-items: flex-start; gap: 6px; }
      .stickbox svg { width: 72px; height: 72px; }
      .trig { grid-template-columns: 22px 1fr 30px; gap: 6px; }
      pre.log { height: 260px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>OmniPad PS5</h1>
        <span class="ver" id="ver">—</span>
      </div>
      <div class="hdr-right">
        <span class="link"><span class="led" id="linkLed"></span><span id="linkText"></span></span>
        <div class="seg" role="group" id="themeSeg">
          <button type="button" data-set-theme="light" id="btnLight"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button type="button" data-set-theme="dark" id="btnDark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        </div>
        <div class="seg" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="pt">PT</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <div class="banner" id="offline"></div>

    <div class="slots" id="slots" role="tablist"></div>

    <div class="main">
      <section class="panel" aria-labelledby="hTest">
        <h2><span id="hTest"></span><span class="pill" id="slotPill"></span></h2>
        <div class="pad-wrap idle" id="padWrap">
          <!-- DualSense-style controller in one colour per theme, wide touchpad with light bar -->
          <svg class="pad" viewBox="0 0 520 340" aria-hidden="true">
            <!-- L2 / R2 -->
            <g transform="rotate(-7 152 34)">
              <rect class="trig-bg" x="116" y="20" width="72" height="24" rx="10"/>
              <rect class="trig-fill" id="t-l2" x="116" y="20" width="0" height="24" rx="10"/>
              <text class="lbl" x="152" y="36">L2</text>
            </g>
            <g transform="rotate(7 368 34)">
              <rect class="trig-bg" x="332" y="20" width="72" height="24" rx="10"/>
              <rect class="trig-fill" id="t-r2" x="332" y="20" width="0" height="24" rx="10"/>
              <text class="lbl" x="368" y="36">R2</text>
            </g>
            <!-- L1 / R1 -->
            <rect class="key" id="k-l1" x="108" y="48" width="86" height="13" rx="6.5" transform="rotate(-7 151 54)"/>
            <rect class="key" id="k-r1" x="326" y="48" width="86" height="13" rx="6.5" transform="rotate(7 369 54)"/>
            <!-- shell -->
            <path class="shell" d="M260,58 C210,58 168,58 140,62 C112,66 92,76 78,94 C58,120 46,162 38,208 C30,258 30,300 54,318 C76,334 104,324 118,304 C134,280 150,254 176,244 C200,236 230,234 260,234 C290,234 320,236 344,244 C370,254 386,280 402,304 C416,324 444,334 466,318 C490,300 490,258 482,208 C474,162 462,120 442,94 C428,76 408,66 380,62 C352,58 310,58 260,58 Z"/>
            <!-- touchpad and light bar -->
            <rect class="touch" id="k-touch" x="184" y="62" width="152" height="82" rx="14"/>
            <path class="lightbar" id="lb-l" d="M182,96 Q180,146 214,148"/>
            <path class="lightbar" id="lb-r" d="M338,96 Q340,146 306,148"/>
            <!-- create / options -->
            <rect class="key" id="k-create" x="161" y="74" width="9" height="22" rx="4.5"/>
            <rect class="key" id="k-options" x="350" y="74" width="9" height="22" rx="4.5"/>
            <!-- d-pad: four separate arrows pointing at the centre (118,140) -->
            <path class="key" id="k-up" d="M110,110 h16 v15 l-8,9 l-8,-9 Z"/>
            <path class="key" id="k-down" d="M110,170 h16 v-15 l-8,-9 l-8,9 Z"/>
            <path class="key" id="k-left" d="M88,132 v16 h15 l9,-8 l-9,-8 Z"/>
            <path class="key" id="k-right" d="M148,132 v16 h-15 l-9,-8 l9,-8 Z"/>
            <!-- face buttons around (402,140) -->
            <g class="face" id="f-tri"><circle class="key" id="k-tri" cx="402" cy="113" r="13"/><path class="glyph" d="M402,106.5 L408.5,117.5 L395.5,117.5 Z"/></g>
            <g class="face" id="f-cir"><circle class="key" id="k-cir" cx="429" cy="140" r="13"/><circle class="glyph" cx="429" cy="140" r="6"/></g>
            <g class="face" id="f-crs"><circle class="key" id="k-crs" cx="402" cy="167" r="13"/><path class="glyph" d="M396.5,161.5 L407.5,172.5 M407.5,161.5 L396.5,172.5"/></g>
            <g class="face" id="f-sqr"><circle class="key" id="k-sqr" cx="375" cy="140" r="13"/><rect class="glyph" x="369.5" y="134.5" width="11" height="11" rx="1"/></g>
            <!-- sticks -->
            <circle class="well" cx="200" cy="192" r="27"/>
            <g class="stick" id="s-l" transform="translate(200 192)"><circle class="cap" r="18"/><circle class="cap-ring" r="11"/></g>
            <circle class="well" cx="320" cy="192" r="27"/>
            <g class="stick" id="s-r" transform="translate(320 192)"><circle class="cap" r="18"/><circle class="cap-ring" r="11"/></g>
            <!-- PS and mute -->
            <circle class="ckey" id="k-ps" cx="260" cy="186" r="9"/>
            <path class="ps-glyph" d="M257.5,191 V181 h3.5 a2.5,2.5 0 0 1 0,5 h-3.5"/>
            <rect class="ckey" id="k-mute" x="251" y="206" width="18" height="7" rx="3.5"/>
          </svg>
          <div class="pad-hint" id="padHint"></div>
        </div>

        <div class="readouts">
          <div class="stickbox">
            <svg viewBox="0 0 84 84" aria-hidden="true"><circle class="ring" cx="42" cy="42" r="38"/><path class="cross" d="M42,6 V78 M6,42 H78"/><circle class="dot" id="m-l" cx="42" cy="42" r="5"/></svg>
            <div class="kv"><span id="lblLS"></span><br>X <b id="v-lx">128</b> Y <b id="v-ly">128</b></div>
          </div>
          <div class="stickbox">
            <svg viewBox="0 0 84 84" aria-hidden="true"><circle class="ring" cx="42" cy="42" r="38"/><path class="cross" d="M42,6 V78 M6,42 H78"/><circle class="dot" id="m-r" cx="42" cy="42" r="5"/></svg>
            <div class="kv"><span id="lblRS"></span><br>X <b id="v-rx">128</b> Y <b id="v-ry">128</b></div>
          </div>
          <div class="trig"><span>L2</span><div class="bar"><i id="b-l2"></i></div><b id="v-l2">0</b></div>
          <div class="trig"><span>R2</span><div class="bar"><i id="b-r2"></i></div><b id="v-r2">0</b></div>
        </div>
        <div class="chips" id="chips" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="hHealth">
        <h2><span id="hHealth"></span></h2>
        <div class="stats">
          <div class="stat"><div class="k" id="kRate"></div><div class="v" id="vRate">—</div></div>
          <div class="stat"><div class="k" id="kAge"></div><div class="v" id="vAge">—</div></div>
          <div class="stat"><div class="k" id="kInj"></div><div class="v" id="vInj">—</div></div>
          <div class="stat"><div class="k" id="kUp"></div><div class="v" id="vUp">—</div></div>
          <div class="stat"><div class="k" id="kConn"></div><div class="v" id="vConn">—</div></div>
          <div class="stat"><div class="k">VID:PID</div><div class="v" id="vId">—</div></div>
          <div class="stat wide"><div class="k" id="kState"></div><div class="v" id="vState">—</div></div>
        </div>
        <div class="note" id="idleNote"></div>
        <div class="actions">
          <button type="button" id="btnPS"></button>
          <button type="button" id="btnDrop" class="danger"></button>
        </div>
      </section>
    </div>

    <section class="panel" aria-labelledby="hBt">
      <h2><span id="hBt"></span><span class="pill" id="btPill">—</span></h2>
      <div class="stats">
        <div class="stat"><div class="k" id="kBtAdapter"></div><div class="v" id="vBtAdapter">—</div></div>
        <div class="stat"><div class="k" id="kBtAddr"></div><div class="v" id="vBtAddr">—</div></div>
        <div class="stat"><div class="k" id="kBtPaired"></div><div class="v" id="vBtPaired">—</div></div>
        <div class="stat wide"><div class="k" id="kBtPads"></div><div class="v" id="vBtPads">—</div></div>
      </div>
      <div class="note" id="btNote"></div>
      <div class="actions">
        <button type="button" id="btnBtPair"></button>
        <button type="button" id="btnBtForget" class="danger"></button>
      </div>
    </section>

    <section class="panel" aria-labelledby="hLog">
      <h2><span id="hLog"></span><span class="pill" id="logCount">0</span></h2>
      <div class="log-tools">
        <div class="grow"><input type="search" id="logFilter" autocomplete="off"></div>
        <div class="quick" id="quick" role="group"></div>
        <button type="button" class="ghost" id="btnPause"></button>
        <button type="button" class="ghost" id="btnClear"></button>
      </div>
      <pre class="log" id="log"></pre>
    </section>

    <div class="actions">
      <button type="button" id="btnDropAll" class="danger"></button>
      <button type="button" id="btnStop" class="danger"></button>
    </div>

    <footer><span id="foot"></span> · <a href="/api/log" target="_blank" rel="noopener" id="rawLog"></a></footer>
  </div>

  <script>
  (() => {
    'use strict';

    const I18N = {
      pt: {
        linkOk: 'Conectado ao PS5', linkWait: 'Conectando…', linkBad: 'Sem resposta',
        offline: 'Sem resposta do PS5. Confira se o payload ainda está rodando e se o PS5 está na mesma rede.',
        player: 'Jogador', free: 'Livre', waiting: 'Aguardando controle',
        st: ['Livre', 'Na fila', 'Aguardando perfil', 'Pronto', 'Falhou'],
        conn: ['—', 'Bluetooth', 'Bluetooth LE', 'USB (cabo)', 'Dongle 2.4G', 'Rede'],
        test: 'Teste do controle', health: 'Saúde da conexão',
        hintFree: 'Conecte um controle por USB ou dongle pra testar aqui.',
        hintWait: 'Aperte qualquer botão pra começar.',
        ls: 'Analógico esq.', rs: 'Analógico dir.', none: 'Nenhum botão apertado',
        kRate: 'Relatórios/s', kAge: 'Último relatório', kInj: 'Injeções/s', kUp: 'Conectado há',
        kConn: 'Conexão', kState: 'Estado no PS5',
        ago: 'atrás', never: 'nunca',
        idle: (s, lim) => s < lim
          ? `Sem dados há ${s}s. Pela regra de inatividade (${lim} s), o slot é liberado em ${lim - s}s e a tela de perfil volta no próximo botão.`
          : `Sem dados há ${s}s. Pela regra de inatividade (${lim} s), o slot é liberado a qualquer momento e a tela de perfil volta no próximo botão.`,
        quiet: 'Este controle só manda dados quando algo muda. Parado, os relatórios/s caem a zero, e isso é normal.',
        ps: 'Simular botão PS', drop: 'Desconectar slot', dropAll: 'Desconectar todos', stop: 'Parar o OmniPad',
        confirmStop: 'Parar o OmniPad? Os controles param de funcionar até você carregar o payload de novo.',
        confirmDropAll: 'Desconectar todos os controles virtuais?',
        log: 'Log ao vivo', filter: 'Filtrar o log…', pause: 'Pausar', resume: 'Continuar', clear: 'Limpar',
        qAll: 'Tudo', qUsb: 'USB', qSlot: 'Slots', qErr: 'Erros',
        raw: 'log bruto', up: 'ligado há', light: 'Tema claro', dark: 'Tema escuro',
        bt: 'Bluetooth (adaptador USB)', btAdapter: 'Adaptador', btAddr: 'Endereço', btPaired: 'Pareados', btPads: 'Conectados',
        btState: { 'no adapter': 'Sem adaptador', starting: 'Iniciando', ready: 'Pronto', stopping: 'Parando' },
        btNoAdapter: 'Plugue um adaptador Bluetooth USB no PS5. O DualSense continua no rádio do próprio PS5.',
        btIdle: 'Controles já pareados voltam sozinhos ao apertar PS. Pra um controle novo, toque em Parear e coloque ele em pareamento (DS4: segure Share + PS).',
        btPairing: (s) => `Procurando controles em modo de pareamento… ${s}s restantes.`,
        btPair: 'Parear controle', btCancel: 'Parar busca', btForget: 'Esquecer pareados',
        confirmForget: 'Esquecer todos os controles pareados? Eles vão precisar ser pareados de novo.'
      },
      en: {
        linkOk: 'Connected to PS5', linkWait: 'Connecting…', linkBad: 'No response',
        offline: 'No response from the PS5. Check that the payload is still running and the PS5 is on the same network.',
        player: 'Player', free: 'Free', waiting: 'Waiting for a controller',
        st: ['Free', 'Queued', 'Waiting for profile', 'Ready', 'Failed'],
        conn: ['—', 'Bluetooth', 'Bluetooth LE', 'USB (cable)', '2.4G dongle', 'Network'],
        test: 'Controller test', health: 'Connection health',
        hintFree: 'Plug in a controller over USB or a dongle to test it here.',
        hintWait: 'Press any button to start.',
        ls: 'Left stick', rs: 'Right stick', none: 'No button pressed',
        kRate: 'Reports/s', kAge: 'Last report', kInj: 'Injections/s', kUp: 'Connected for',
        kConn: 'Connection', kState: 'State on PS5',
        ago: 'ago', never: 'never',
        idle: (s, lim) => s < lim
          ? `No data for ${s}s. Under the idle rule (${lim} s), the slot is released in ${lim - s}s and the profile screen returns on the next press.`
          : `No data for ${s}s. Under the idle rule (${lim} s), the slot is about to be released and the profile screen returns on the next press.`,
        quiet: 'This controller only sends data when something changes. Idle, reports/s drop to zero, which is normal.',
        ps: 'Simulate PS button', drop: 'Disconnect slot', dropAll: 'Disconnect all', stop: 'Stop OmniPad',
        confirmStop: 'Stop OmniPad? Controllers stop working until you load the payload again.',
        confirmDropAll: 'Disconnect all virtual controllers?',
        log: 'Live log', filter: 'Filter the log…', pause: 'Pause', resume: 'Resume', clear: 'Clear',
        qAll: 'All', qUsb: 'USB', qSlot: 'Slots', qErr: 'Errors',
        raw: 'raw log', up: 'up for', light: 'Light theme', dark: 'Dark theme',
        bt: 'Bluetooth (USB adapter)', btAdapter: 'Adapter', btAddr: 'Address', btPaired: 'Paired', btPads: 'Connected',
        btState: { 'no adapter': 'No adapter', starting: 'Starting', ready: 'Ready', stopping: 'Stopping' },
        btNoAdapter: 'Plug a USB Bluetooth adapter into the PS5. The DualSense stays on the console’s own radio.',
        btIdle: 'Paired controllers come back on their own when you press PS. For a new one, tap Pair and put it in pairing mode (DS4: hold Share + PS).',
        btPairing: (s) => `Looking for controllers in pairing mode… ${s}s left.`,
        btPair: 'Pair controller', btCancel: 'Stop search', btForget: 'Forget paired',
        confirmForget: 'Forget every paired controller? They will need to be paired again.'
      }
    };

    /* Bits from src/pad_types.h */
    const BTN = [
      ['create', 1 << 0, 'Create'], ['l3', 1 << 1, 'L3'], ['r3', 1 << 2, 'R3'], ['options', 1 << 3, 'Options'],
      ['up', 1 << 4, '↑'], ['right', 1 << 5, '→'], ['down', 1 << 6, '↓'], ['left', 1 << 7, '←'],
      ['l2', 1 << 8, 'L2'], ['r2', 1 << 9, 'R2'], ['l1', 1 << 10, 'L1'], ['r1', 1 << 11, 'R1'],
      ['tri', 1 << 12, '△'], ['cir', 1 << 13, '○'], ['crs', 1 << 14, '✕'], ['sqr', 1 << 15, '□'],
      ['ps', 1 << 16, 'PS'], ['mute', 1 << 18, 'Mute'], ['touch', 1 << 20, 'Touchpad']
    ];
    const ST_FREE = 0, ST_READY = 3;
    const STICK_L = [200, 192], STICK_R = [320, 192], STICK_TRAVEL = 10, TRIG_W = 72;
    const STATE_EVERY_MS = 33, LOG_EVERY_MS = 1000, MAX_LOG_LINES = 1500;

    const $ = (id) => document.getElementById(id);
    function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }

    let lang = load('omnipad.lang', (navigator.language || 'pt').slice(0, 2)) === 'en' ? 'en' : 'pt';
    let T = I18N[lang];
    let theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    let selected = Number(load('omnipad.slot', '0')) || 0;
    let last = null;          // last /api/state
    let failures = 0;
    const hist = [[], [], []]; // per slot: [{t, inputs, injected}]

    /* ---------- formatting ---------- */
    function fmtDur(ms) {
      if (ms == null || ms < 0) return T.never;
      const s = Math.floor(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
      return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
    }
    function hex4(n) { return Number(n || 0).toString(16).padStart(4, '0'); }
    function connName(c) { return T.conn[c] || T.conn[0]; }

    /* ---------- static text ---------- */
    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      $('btnLight').setAttribute('aria-pressed', String(theme === 'light'));
      $('btnDark').setAttribute('aria-pressed', String(theme === 'dark'));
    }

    function applyLang() {
      T = I18N[lang];
      document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      $('btnLight').setAttribute('aria-label', T.light); $('btnLight').title = T.light;
      $('btnDark').setAttribute('aria-label', T.dark); $('btnDark').title = T.dark;
      $('hTest').textContent = T.test; $('hHealth').textContent = T.health; $('hLog').textContent = T.log;
      $('hBt').textContent = T.bt; $('kBtAdapter').textContent = T.btAdapter; $('kBtAddr').textContent = T.btAddr;
      $('kBtPaired').textContent = T.btPaired; $('kBtPads').textContent = T.btPads; $('btnBtForget').textContent = T.btForget;
      if (last) renderBt(last.bt);
      $('lblLS').textContent = T.ls; $('lblRS').textContent = T.rs;
      $('kRate').textContent = T.kRate; $('kAge').textContent = T.kAge; $('kInj').textContent = T.kInj;
      $('kUp').textContent = T.kUp; $('kConn').textContent = T.kConn; $('kState').textContent = T.kState;
      $('btnPS').textContent = T.ps; $('btnDrop').textContent = T.drop;
      $('btnDropAll').textContent = T.dropAll; $('btnStop').textContent = T.stop;
      $('logFilter').placeholder = T.filter; $('btnClear').textContent = T.clear;
      $('btnPause').textContent = logPaused ? T.resume : T.pause;
      $('offline').textContent = T.offline; $('rawLog').textContent = T.raw;
      buildQuick();
      renderLog();
      if (last) render(last);
    }

    /* ---------- slot cards ---------- */
    function buildSlots() {
      const box = $('slots');
      for (let i = 0; i < 3; i++) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'slot'; b.setAttribute('role', 'tab'); b.id = `slot${i}`;
        b.innerHTML = '<div class="top"><span class="pl"></span><span class="led"></span></div><div class="nm"></div><div class="sub"></div>';
        b.addEventListener('click', () => { selected = i; save('omnipad.slot', String(i)); if (last) render(last); });
        box.appendChild(b);
      }
    }

    function slotLed(s) {
      if (s.status === ST_READY) return 'ok';
      if (s.status === 1 || s.status === 2) return 'warn';
      if (s.status === 4) return 'bad';
      return '';
    }

    /* ---------- rates ---------- */
    function pushHist(i, t, s) {
      const h = hist[i];
      if (h.length && (s.inputs < h[h.length - 1].inputs || s.injected < h[h.length - 1].injected)) h.length = 0; // slot reused
      h.push({ t, inputs: s.inputs, injected: s.injected });
      while (h.length > 2 && t - h[0].t > 1500) h.shift();
    }
    function rate(i, key) {
      const h = hist[i];
      if (h.length < 2) return null;
      const a = h[0], b = h[h.length - 1];
      const dt = (b.t - a.t) / 1000;
      return dt > 0.2 ? (b[key] - a[key]) / dt : null;
    }

    /* ---------- render ---------- */
    function setKey(id, on) { const el = $(id); if (el) el.classList.toggle('on', on); }
    function moveStick(id, [cx, cy], x, y) {
      const off = (v) => ((v - 128) / 128) * STICK_TRAVEL;
      $(id).setAttribute('transform', `translate(${cx + off(x)} ${cy + off(y)})`);
    }

    function renderBt(bt) {
      if (!bt) return;
      const ready = bt.state === 'ready', pairing = ready && bt.pairing_left > 0;
      $('btPill').textContent = T.btState[bt.state] || bt.state;
      $('vBtAdapter').textContent = bt.adapter || '—';
      $('vBtAddr').textContent = bt.address || '—';
      $('vBtPaired').textContent = ready ? String(bt.paired) : '—';
      $('vBtPads').textContent = bt.pads.length ? bt.pads.map(p => `${p.name} · slot ${p.slot}`).join(', ') : '—';
      $('btNote').textContent = bt.state === 'no adapter' ? T.btNoAdapter : pairing ? T.btPairing(bt.pairing_left) : T.btIdle;
      $('btnBtPair').textContent = pairing ? T.btCancel : T.btPair;
      $('btnBtPair').disabled = !ready;
      $('btnBtForget').disabled = !ready || bt.paired === 0;
    }

    function render(d) {
      renderBt(d.bt);
      $('ver').textContent = `v${d.version} · build ${d.build} · ${T.up} ${fmtDur(d.uptime_ms)}`;
      $('foot').textContent = `OmniPad PS5 v${d.version} (build ${d.build})`;

      d.slots.forEach((s, i) => {
        const b = $(`slot${i}`);
        const free = s.status === ST_FREE;
        b.classList.toggle('free', free);
        b.setAttribute('aria-selected', String(i === selected));
        // the log numbers slots from 0; phones only show the short form
        b.querySelector('.pl').innerHTML = `<span class="long">${T.player} ${i + 2} · slot ${i}</span><span class="short">P${i + 2}</span>`;
        b.querySelector('.led').className = 'led ' + slotLed(s);
        b.querySelector('.nm').textContent = free ? T.free : (s.name || 'Controller');
        b.querySelector('.sub').textContent = free ? T.waiting : `${connName(s.conn)} · ${T.st[s.status] || ''}`;
      });

      const s = d.slots[selected] || d.slots[0];
      const free = s.status === ST_FREE;
      const gotInput = s.input_age_ms >= 0;
      const live = !free && gotInput;  // until the first report the pad is drawn at rest

      $('slotPill').textContent = `${T.player} ${selected + 2}`;
      $('padWrap').classList.toggle('idle', !live);
      $('padHint').textContent = free ? T.hintFree : T.hintWait;
      ['lb-l', 'lb-r'].forEach(id => $(id).classList.toggle('lit', s.status === ST_READY));

      const btn = live ? s.buttons >>> 0 : 0;
      BTN.forEach(([k, bit]) => setKey(`k-${k}`, (btn & bit) !== 0));
      ['tri', 'cir', 'crs', 'sqr'].forEach(k => $(`f-${k}`).classList.toggle('on', $(`k-${k}`).classList.contains('on')));
      setKey('s-l', (btn & (1 << 1)) !== 0); setKey('s-r', (btn & (1 << 2)) !== 0);

      const lx = live ? s.lx : 128, ly = live ? s.ly : 128, rx = live ? s.rx : 128, ry = live ? s.ry : 128;
      const l2 = live ? s.l2 : 0, r2 = live ? s.r2 : 0;
      moveStick('s-l', STICK_L, lx, ly); moveStick('s-r', STICK_R, rx, ry);
      const off = (v) => ((v - 128) / 128);
      $('m-l').setAttribute('cx', 42 + off(lx) * 33); $('m-l').setAttribute('cy', 42 + off(ly) * 33);
      $('m-r').setAttribute('cx', 42 + off(rx) * 33); $('m-r').setAttribute('cy', 42 + off(ry) * 33);
      $('t-l2').setAttribute('width', TRIG_W * l2 / 255); $('t-r2').setAttribute('width', TRIG_W * r2 / 255);
      $('v-lx').textContent = lx; $('v-ly').textContent = ly; $('v-rx').textContent = rx; $('v-ry').textContent = ry;
      $('v-l2').textContent = l2; $('v-r2').textContent = r2;
      $('b-l2').style.width = `${l2 / 2.55}%`; $('b-r2').style.width = `${r2 / 2.55}%`;

      const pressed = BTN.filter(([, bit]) => btn & bit).map(([, , label]) => label);
      const chips = $('chips');
      const sig = lang + pressed.join('|');
      if (chips.dataset.sig !== sig) {
        chips.dataset.sig = sig;
        chips.innerHTML = '';
        if (!pressed.length) {
          const n = document.createElement('span'); n.className = 'none'; n.textContent = T.none; chips.appendChild(n);
        } else pressed.forEach(p => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = p; chips.appendChild(c); });
      }

      // health
      const r = rate(selected, 'inputs'), inj = rate(selected, 'injected');
      $('vRate').textContent = free || r == null ? '—' : Math.round(r);
      $('vInj').textContent = free || inj == null ? '—' : Math.round(inj);
      $('vInj').className = 'v' + (free || inj == null ? '' : (s.status === ST_READY ? (inj >= 200 ? ' ok' : ' warn') : ''));
      $('vAge').innerHTML = free ? '—' : (gotInput ? `${fmtDur(s.input_age_ms)} <small>${T.ago}</small>` : T.never);
      $('vUp').textContent = free ? '—' : fmtDur(s.connected_ms);
      $('vConn').textContent = free ? '—' : connName(s.conn);
      $('vId').textContent = free || (!s.vid && !s.pid) ? '—' : `${hex4(s.vid)}:${hex4(s.pid)}`;
      $('vState').textContent = T.st[s.status] || '—';
      $('vState').className = 'v ' + ({ 3: 'ok', 1: 'warn', 2: 'warn', 4: 'bad' }[s.status] || '');

      const note = $('idleNote');
      const idleS = gotInput ? Math.floor(s.input_age_ms / 1000) : 0;
      const limS = Math.round((s.idle_release_ms || 0) / 1000);
      if (!free && limS > 0 && s.status === ST_READY && idleS >= 10) {
        note.className = 'note warn'; note.textContent = T.idle(idleS, limS);
      } else if (!free && gotInput && r === 0) {
        note.className = 'note'; note.textContent = T.quiet;
      } else { note.className = 'note'; note.textContent = ''; }

      $('btnPS').disabled = s.status !== ST_READY;
      $('btnDrop').disabled = free;
    }

    /* ---------- polling ---------- */
    function setLink(state) {
      $('linkLed').className = 'led ' + state;
      $('linkText').textContent = state === 'ok' ? T.linkOk : state === 'bad' ? T.linkBad : T.linkWait;
      $('offline').classList.toggle('show', state === 'bad');
    }

    let lastOk = performance.now();

    async function pollState() {
      if (document.hidden) { setTimeout(pollState, 500); return; }
      const t0 = performance.now();
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 2000); // an unreachable PS5 can hang a request for a long time
      try {
        const res = await fetch('/api/state', { cache: 'no-store', signal: abort.signal });
        if (!res.ok) throw new Error(res.status);
        const d = await res.json();
        const t = performance.now();
        d.slots.forEach((s, i) => pushHist(i, t, s));
        last = d; failures = 0; lastOk = t; setLink('ok');
        render(d);
      } catch (e) {
        failures++;
        setLink(performance.now() - lastOk > 4000 ? 'bad' : 'warn');
      } finally {
        clearTimeout(timer);
      }
      const spent = performance.now() - t0;
      setTimeout(pollState, failures ? 1000 : Math.max(0, STATE_EVERY_MS - spent));
    }

    /* ---------- log ---------- */
    let logLines = [];
    let logOffset = null;
    let logPaused = false;
    let quick = 'all';
    const QUICK = {
      all: null,
      usb: /usb_hotplug|usb_ctrl|ugen|VID|dongle|player LED/i,
      bt: /bt:|pad [0-9A-F]{2}:|pairing|inquiry|controller|link |le:/,
      slot: /vpad:|slot \d|AddDevice|released|releasing|re-arming|profile|ready|removed/i,
      err: /error|fail|disconnect|unparsed|timeout|warning|idle for/i
    };

    function buildQuick() {
      const box = $('quick');
      box.innerHTML = '';
      [['all', T.qAll], ['usb', T.qUsb], ['bt', 'Bluetooth'], ['slot', T.qSlot], ['err', T.qErr]].forEach(([k, label]) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ghost'; b.textContent = label;
        b.setAttribute('aria-pressed', String(k === quick));
        b.addEventListener('click', () => { quick = k; buildQuick(); renderLog(); });
        box.appendChild(b);
      });
    }

    function classify(line) {
      if (/error|fail|disconnected|unparsed/i.test(line)) return 'e';
      if (/idle|releasing|warning|pending|0x803b0006/i.test(line)) return 'w';
      if (/ready|claimed|sent on OUT|Active|initialized/i.test(line)) return 'g';
      return '';
    }

    function renderLog() {
      const pre = $('log');
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
      const text = $('logFilter').value.trim().toLowerCase();
      const rx = QUICK[quick];
      const frag = document.createDocumentFragment();
      let shown = 0;
      for (const line of logLines) {
        if (rx && !rx.test(line)) continue;
        if (text && !line.toLowerCase().includes(text)) continue;
        const m = /^(\[[^\]]+\]) ?(.*)$/.exec(line);
        const row = document.createElement('div');
        if (m) {
          const ts = document.createElement('span'); ts.className = 't'; ts.textContent = m[1] + ' ';
          const body = document.createElement('span'); body.className = classify(m[2]); body.textContent = m[2];
          row.append(ts, body);
        } else row.textContent = line;
        frag.appendChild(row);
        shown++;
      }
      pre.replaceChildren(frag);
      $('logCount').textContent = String(shown);
      if (atBottom && !logPaused) pre.scrollTop = pre.scrollHeight;
    }

    async function pollLog() {
      if (!document.hidden && !logPaused) {
        try {
          const url = logOffset == null ? '/api/log' : `/api/log?since=${logOffset}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const body = await res.text();
            const next = Number(res.headers.get('X-Log-Offset'));
            if (logOffset != null && Number.isFinite(next) && next < logOffset) logLines = []; // log file was replaced
            if (Number.isFinite(next)) logOffset = next;
            const fresh = body.split('\n').filter(Boolean);
            if (fresh.length) {
              logLines = logLines.concat(fresh).slice(-MAX_LOG_LINES);
              renderLog();
            }
          }
        } catch (e) { /* the state poll already reports the link */ }
      }
      setTimeout(pollLog, LOG_EVERY_MS);
    }

    /* ---------- actions ---------- */
    async function post(path) {
      try { await fetch(path, { method: 'POST' }); } catch (e) { /* surfaced by the link indicator */ }
    }

    function wire() {
      document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
        lang = b.dataset.lang; save('omnipad.lang', lang); applyLang();
      }));
      document.querySelectorAll('#themeSeg [data-set-theme]').forEach(b => b.addEventListener('click', () => {
        theme = b.dataset.setTheme; save('omnipad.theme', theme); applyTheme();
      }));
      $('btnPS').addEventListener('click', () => post(`/api/press_ps?slot=${selected}`));
      $('btnDrop').addEventListener('click', () => post(`/api/disconnect?slot=${selected}`));
      $('btnDropAll').addEventListener('click', () => { if (confirm(T.confirmDropAll)) post('/api/disconnect?slot=-1'); });
      $('btnStop').addEventListener('click', () => { if (confirm(T.confirmStop)) post('/api/exit'); });
      $('btnBtPair').addEventListener('click', () => {
        const pairing = last && last.bt && last.bt.pairing_left > 0;
        post(`/api/pair?seconds=${pairing ? 0 : 120}`);
      });
      $('btnBtForget').addEventListener('click', () => { if (confirm(T.confirmForget)) post('/api/bt_forget'); });
      $('logFilter').addEventListener('input', renderLog);
      $('btnPause').addEventListener('click', () => { logPaused = !logPaused; $('btnPause').textContent = logPaused ? T.resume : T.pause; if (!logPaused) renderLog(); });
      $('btnClear').addEventListener('click', () => { logLines = []; renderLog(); });
    }

    buildSlots();
    wire();
    applyTheme();
    applyLang();
    setLink('');
    pollState();
    pollLog();
  })();
  </script>
</body>
</html>
