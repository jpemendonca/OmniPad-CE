<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>OmniPad CE</title>
  <script>
    /* Apply the saved theme before first paint; light is the default */
    try { document.documentElement.dataset.theme = localStorage.getItem('omnipad.theme') === 'dark' ? 'dark' : 'light'; } catch (e) { /* private mode */ }
    /* Opened from the Media tab tile on the PS5 itself: bigger text and targets for a TV */
    if (/[?&]tv\b/.test(location.search)) document.documentElement.classList.add('tv');
  </script>
  <style>
    :root {
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --tri: #1fb57a;
      --cir: #e5484d;
      --crs: #3b82f6;
      --sqr: #d6409f;
    }
    :root, [data-theme="light"] {
      --bg: #eef1f6;
      --panel: #ffffff;
      --panel-2: #f5f7fb;
      --line: rgba(15, 23, 42, 0.08);
      --line-strong: rgba(15, 23, 42, 0.16);
      --hover: rgba(15, 23, 42, 0.32);
      --text: #0f172a;
      --muted: #5b6678;
      --faint: #94a0b2;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-text: #1d4ed8;
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.10);
      --warn: #b45309;
      --warn-soft: rgba(217, 119, 6, 0.10);
      --bad: #dc2626;
      --bad-soft: rgba(220, 38, 38, 0.08);
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 16px rgba(15, 23, 42, 0.05);
      /* controller */
      --pad-shell: #ffffff;
      --pad-shell-edge: #c3ccd9;
      --pad-core-edge: #c3ccd9;
      --pad-touch: #f3f5f9;
      --pad-key: #eef1f6;
      --pad-key-edge: #c3ccd9;
      --pad-glyph: #8a94a6;
      --pad-well: #e9edf3;
      --pad-cap: #f7f9fc;
      --pad-cap-ring: #b9c2d0;
      --pad-core-key: #eef1f6;
      --pad-trig: #e4e8ef;
      --pad-label: #7a8496;
      --log-bg: #f8fafc;
      --log-text: #1e293b;
    }
    [data-theme="dark"] {
      --bg: #080b12;
      --panel: #111827;
      --panel-2: #0d1320;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --hover: rgba(255, 255, 255, 0.32);
      --text: #e8edf5;
      --muted: #8a96a8;
      --faint: #5b6678;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.16);
      --accent-text: #b9d1ff;
      --ok: #2dd4a0;
      --ok-soft: rgba(45, 212, 160, 0.14);
      --warn: #f5b443;
      --warn-soft: rgba(245, 180, 67, 0.14);
      --bad: #f26d6d;
      --bad-soft: rgba(242, 109, 109, 0.14);
      --shadow: none;
      --pad-shell: #1c2433;
      --pad-shell-edge: #34405a;
      --pad-core-edge: #34405a;
      --pad-touch: #222c3e;
      --pad-key: #273246;
      --pad-key-edge: #3a4762;
      --pad-glyph: #7d8aa3;
      --pad-well: #141b28;
      --pad-cap: #2b3448;
      --pad-cap-ring: #3c4762;
      --pad-core-key: #273246;
      --pad-trig: #1a2130;
      --pad-label: #6b7790;
      --log-bg: #0d1320;
      --log-text: #c3ccda;
      --tri: #3ddc97;
      --cir: #ff6b6b;
      --crs: #5aa9ff;
      --sqr: #f78fd0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
    button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button:hover { border-color: var(--hover); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: default; transform: none; }
    button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-soft); }
    button.ghost { background: transparent; }
    .map-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
    .map-msg { font-size: 13px; color: var(--muted); }
    .map-msg.warn { color: var(--warn); }
    .map-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .map-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font-weight: 600; }
    .pad .hit { fill: transparent; pointer-events: none; }
    .pad-wrap.mapping .pad .hit { pointer-events: all; cursor: pointer; }
    .pad .map-target { transition: translate 120ms ease-out; }
    .pad-wrap.mapping .pad .map-hover, .pad .map-wait { translate: 0 -3px; }
    .pad-wrap .pad .mapped, .pad-wrap .pad .mapped .key, .pad-wrap .pad .mapped .ckey, .pad-wrap .pad .mapped .cap, .pad-wrap .pad .mapped .trig-bg,
    .pad-wrap.mapping .pad .map-hover, .pad-wrap.mapping .pad .map-hover .key, .pad-wrap.mapping .pad .map-hover .ckey, .pad-wrap.mapping .pad .map-hover .cap, .pad-wrap.mapping .pad .map-hover .trig-bg { stroke: var(--accent); stroke-width: 2.5; }
    .pad-wrap .pad .map-wait, .pad-wrap .pad .map-wait .key, .pad-wrap .pad .map-wait .ckey, .pad-wrap .pad .map-wait .cap, .pad-wrap .pad .map-wait .trig-bg { stroke: var(--warn); stroke-width: 3; }
    .pad .map-wait { animation: map-pulse 1s ease-in-out infinite; }
    @keyframes map-pulse { 50% { opacity: 0.45; } }
    .map-tip { position: absolute; display: none; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 7px; background: var(--text); color: var(--panel); font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; z-index: 2; }
    .map-tip.show { display: block; }
    @media (prefers-reduced-motion: reduce) { .pad .map-target { transition: none; } .pad .map-wait { animation: none; } }
    input[type=search] { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; min-height: 38px; width: 100%; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .brand .ver { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
    .led.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .led.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .led.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .seg { display: inline-flex; gap: 4px; }
    .lang-sel { font: inherit; font-size: 12px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; min-height: 30px; padding: 4px 8px; }
    .seg button { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .seg button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
    .seg svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .banner { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); font-size: 13px; }
    .banner.show { display: block; }

    /* Slot cards */
    .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .slot { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 92px; font-weight: 400; }
    .slot[aria-selected=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
    .slot .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .slot .pl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
    .slot .top-r { display: inline-flex; align-items: center; gap: 8px; }
    .bat { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .bat .cell { position: relative; width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; }
    .bat .cell::after { content: ""; position: absolute; right: -4px; top: 2.5px; width: 2px; height: 3px; background: currentColor; border-radius: 0 1px 1px 0; }
    .bat .cell i { display: block; height: 100%; background: currentColor; border-radius: 1px; }
    .bat.low { color: var(--bad); }
    .bat.chg { color: var(--ok); }
    .slot .nm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot.free .nm { color: var(--faint); font-weight: 600; }
    .slot .pl .short { display: none; }

    /* Main tester */
    .main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
    .panel h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pad-wrap { position: relative; }
    .pad-wrap.idle svg.pad { opacity: 0.45; }
    .pad-hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; padding: 24px; }
    .pad-wrap.idle .pad-hint { display: flex; }
    svg.pad { width: 100%; height: auto; display: block; }

    /* DualSense drawing */
    .pad .shell { fill: var(--pad-shell); stroke: var(--pad-shell-edge); stroke-width: 2; }
    .pad .touch { fill: var(--pad-touch); stroke: var(--pad-shell-edge); stroke-width: 1.5; transition: fill 60ms; }
    .pad .touch.on { fill: var(--accent-soft); stroke: var(--accent); }
    .pad .lightbar { fill: none; stroke: var(--pad-shell-edge); stroke-width: 3; stroke-linecap: round; transition: stroke 200ms; }
    .pad .lightbar.lit { stroke: var(--accent); filter: drop-shadow(0 0 3px var(--accent)); }
    .pad .key { fill: var(--pad-key); stroke: var(--pad-key-edge); stroke-width: 1.5; stroke-linejoin: round; transition: fill 60ms; }
    .pad .key.on { fill: var(--accent); stroke: var(--accent); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent)); }
    .pad .ckey { fill: var(--pad-core-key); stroke: var(--pad-core-edge); stroke-width: 1.5; transition: fill 60ms; }
    .pad .ckey.on { fill: var(--accent); stroke: var(--accent); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent)); }
    .pad .glyph { fill: none; stroke: var(--pad-glyph); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transition: stroke 60ms; }
    .pad .face.on .glyph { stroke: #fff; }
    .pad #k-tri.on { fill: var(--tri); stroke: var(--tri); } .pad #k-cir.on { fill: var(--cir); stroke: var(--cir); }
    .pad #k-crs.on { fill: var(--crs); stroke: var(--crs); } .pad #k-sqr.on { fill: var(--sqr); stroke: var(--sqr); }
    .pad .well { fill: var(--pad-well); stroke: var(--pad-core-edge); stroke-width: 1.5; }
    .pad .cap { fill: var(--pad-cap); stroke: var(--pad-cap-ring); stroke-width: 2; transition: fill 60ms; }
    .pad .cap-ring { fill: none; stroke: var(--pad-cap-ring); stroke-width: 1.5; }
    .pad .stick.on .cap { fill: var(--accent); stroke: var(--accent); }
    .pad .trig-bg { fill: var(--pad-trig); stroke: var(--pad-shell-edge); stroke-width: 1.5; }
    .pad .trig-fill { fill: var(--accent); }
    .pad .lbl { fill: var(--pad-label); font-size: 10px; font-weight: 700; font-family: inherit; text-anchor: middle; pointer-events: none; }
    .pad .ps-glyph { fill: none; stroke: var(--pad-glyph); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .pad .ckey.on + .ps-glyph { stroke: #fff; }

    .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .stickbox { display: flex; gap: 12px; align-items: center; }
    .stickbox svg { width: 84px; height: 84px; flex: none; }
    .stickbox .ring { fill: var(--panel-2); stroke: var(--line-strong); stroke-width: 1.5; }
    .stickbox .cross { stroke: var(--line-strong); stroke-width: 1; }
    .stickbox .dot { fill: var(--accent); }
    .kv { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }
    .kv b { color: var(--text); font-weight: 600; }
    .bar { height: 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 40ms linear; }
    .trig { display: grid; grid-template-columns: 28px 1fr 34px; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; margin-top: 12px; }
    .chip { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .chips .none { font-size: 12px; color: var(--faint); align-self: center; }

    /* Health */
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
    .stat .k { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v small { font-size: 12px; color: var(--muted); font-weight: 600; }
    .stat.wide { grid-column: 1 / -1; }
    .v.ok { color: var(--ok); } .v.warn { color: var(--warn); } .v.bad { color: var(--bad); }
    .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .note.warn { color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

    /* Log */
    .log-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .log-tools .grow { flex: 1 1 200px; }
    .quick button { min-height: 32px; padding: 4px 10px; font-size: 12px; }
    .quick button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
    pre.log { font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--log-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--log-text); }
    pre.log .w { color: var(--warn); } pre.log .e { color: var(--bad); } pre.log .g { color: var(--ok); } pre.log .t { color: var(--faint); }

    /* Status strip: is OmniPad running, what is connected */
    .status { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .status .st-main { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .status .st-items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
    .diag { display: none; margin-bottom: 16px; }
    .diag.show { display: block; }
    .report-btn { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 8px; color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .report-lbl { display: block; margin-top: 10px; font-size: 13px; font-weight: 600; }
    .report details { margin-top: 10px; }
    .report summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent-text); }
    .report-msg.ok { color: var(--ok); font-weight: 700; }
    .report-msg.bad { color: var(--bad); }
    .diag textarea { width: 100%; height: 160px; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--log-text); background: var(--log-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
    .diag textarea#reportMsg { height: 90px; margin-top: 6px; font-family: inherit; font-size: 14px; color: var(--text); background: var(--panel-2); }

    /* New release on GitHub */
    .update { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 14px; font-weight: 600; }
    .update.show { display: flex; }
    .update a { color: inherit; font-weight: 800; }
    html.tv .update { font-size: 18px; }

    /* First steps, while no controller is connected */
    .start { margin-bottom: 16px; }
    .start ol { margin-left: 20px; display: grid; gap: 8px; font-size: 14px; }

    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* TV (the Media tab tile): read from the couch, aimed with the PS5 cursor */
    html.tv body { font-size: 18px; }
    html.tv .wrap { max-width: 1500px; padding: 24px; }
    html.tv button { min-height: 56px; padding: 12px 22px; font-size: 17px; }
    html.tv .seg button { min-height: 44px; font-size: 16px; }
    html.tv .lang-sel { min-height: 44px; font-size: 16px; }
    html.tv .report-btn { min-height: 44px; font-size: 16px; }
    html.tv .report-lbl, html.tv .report summary { font-size: 17px; }
    html.tv .diag textarea#reportMsg { font-size: 18px; height: 120px; }
    html.tv .brand h1 { font-size: 28px; }
    html.tv .status .st-main { font-size: 20px; }
    html.tv .pill { font-size: 15px; padding: 6px 12px; }
    html.tv .panel h2 { font-size: 15px; }
    html.tv .slot .nm { font-size: 18px; }
    html.tv .bat { font-size: 16px; }
    html.tv .slot .sub, html.tv .note, html.tv .start ol { font-size: 16px; }
    html.tv .stat .k { font-size: 13px; }
    html.tv .stat .v { font-size: 24px; }
    html.tv pre.log { font-size: 15px; height: 260px; }
    html.tv :focus-visible { outline-width: 4px; outline-offset: 3px; }

    footer { margin-top: 20px; color: var(--faint); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }

    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .wrap { padding: 12px; }
      .slots { gap: 6px; }
      .slot { min-height: 0; padding: 9px 10px; gap: 3px; }
      .slot .sub, .slot .pl .long { display: none; }
      .slot .pl .short { display: inline; }
      .slot .nm { font-size: 13px; }
      .stickbox { flex-direction: column; align-items: flex-start; gap: 6px; }
      .stickbox svg { width: 72px; height: 72px; }
      .trig { grid-template-columns: 22px 1fr 30px; gap: 6px; }
      pre.log { height: 260px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>OmniPad CE</h1>
        <span class="ver" id="ver">—</span>
      </div>
      <div class="hdr-right">
        <button type="button" class="ghost report-btn" id="btnReport"></button>
        <span class="link"><span class="led" id="linkLed"></span><span id="linkText"></span></span>
        <div class="seg" role="group" id="themeSeg">

        text.textContent = `${remapLabel(to)} ← ${comboLabel(from)}`;
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'ghost'; del.textContent = T.mapDefault;
        del.addEventListener('click', () => saveRemap(s, rules.filter(r => r !== rule), T.mapBack(remapLabel(to))));
        row.append(text, del);
        box.appendChild(row);
      });
      const end = document.createElement('div');
      end.className = 'map-row';
      const note = document.createElement('span');
      note.textContent = T.mapScope;
      note.style.fontWeight = '400';
      const reset = document.createElement('button');
      reset.type = 'button'; reset.className = 'ghost'; reset.textContent = T.mapReset;
      reset.addEventListener('click', () => saveRemap(s, [], ''));
      end.append(note, reset);
      box.appendChild(end);
    }

    function toggleMapping() {
      if (mapWait) {
        mapCancel();
        mapSay('');
      } else if (mapOn) {
        stopMapping();
      } else if (last) {
        mapOn = true;
        mapKey = `${selected}|${remapKey(last.slots[selected])}`;
        mapSay('');
      }
      refreshRemap();
    }

    function stopMapping() { mapCancel(); mapOn = false; setMapHover(''); mapSay(''); }
    function mapCancel() { clearInterval(mapTimer); mapWait = ''; mapPsUntil = 0; }

    function mapAsk(name) {
      mapCancel();
      mapWait = name;
      mapEnd = performance.now() + MAP_SECONDS * 1000;
      mapSeen = 0;
      mapIgnore = 0;
      mapFresh = true;                       // the read on its way may hold presses from before this click
      mapSay('');
      mapCountdown();
      mapTimer = setInterval(mapCountdown, 200);
    }

    function mapCountdown() {
      const now = performance.now(), left = Math.ceil((mapEnd - now) / 1000);
      const s = last && last.slots[selected];
      if (left <= 0) {
        if (mapSeen && s) { mapCommit(s); } else { mapCancel(); mapSay(T.mapTimeout, true); }
      } else if (now < mapPsUntil) {
        mapSay(T.mapPs, true);
      } else {
        mapSay(T.mapPress(remapLabel(mapWait), left));
      }
      refreshRemap();
    }

    /* Called once per read of the state. A combo is everything held until the last button comes back up. */
    function mapTick(s) {
      const raw = s.raw_buttons;
      if (mapFresh) {
        mapFresh = false;
        mapIgnore = raw;                     // what is already held does not count until released
        return;
      }
      mapIgnore &= raw;
      const held = raw & ~mapIgnore;
      const pressed = (raw | s.raw_seen) & ~mapIgnore;   // raw_seen holds a tap shorter than the time between reads
      if (pressed & PS_BIT) {
        mapIgnore |= raw & PS_BIT;           // until it is released: the press also reached the console
        mapSeen = 0;
        mapPsUntil = performance.now() + MAP_PS_WARN_MS;
        return;
      }
      mapSeen |= pressed;
      if (mapSeen && !held) mapCommit(s);
    }

    function mapCommit(s) {
      const target = mapWait;
      const names = Object.keys(REMAP_BITS).filter(n => mapSeen & (1 << REMAP_BITS[n]));
      mapCancel();
      if (!names.length) return;
      if (names.length > MAP_MAX_COMBO) { mapSay(T.mapMany, true); return; }
      const from = names.join('+');
      const rules = remapSplit(remapRules[remapKey(s)])
        .filter(r => r.split('=')[1] !== target && !sameCombo(r.split('=')[0], from));
      if (from === target) { saveRemap(s, rules, T.mapBack(remapLabel(target))); return; }
      saveRemap(s, [...rules, `${from}=${target}`], T.mapSaved(comboLabel(from), remapLabel(target)));
    }

    async function loadRemap() {
      try {
        const d = await (await fetch('/api/remap', { cache: 'no-store' })).json();
        remapRules = {};
        (d.pads || []).forEach(p => { remapRules[`${p.vid}:${p.pid}`] = p.rules; });
        if (last) renderRemap(last.slots[selected]);
      } catch (e) { /* the state poll already reports the link */ }
    }

    async function saveRemap(s, rules, done) {
      mapSay(done);
      try {
        const r = await fetch(`/api/remap?vid=${s.vid}&pid=${s.pid}&rules=${encodeURIComponent(rules.join(','))}`, { method: 'POST' });
        if (!r.ok) mapSay(T.mapBad, true);
      } catch (e) { mapSay(T.mapLost, true); }
      await loadRemap();
    }

    function setKey(id, on) { const el = $(id); if (el) el.classList.toggle('on', on); }
    function moveStick(id, [cx, cy], x, y) {
      const off = (v) => ((v - 128) / 128) * STICK_TRAVEL;
      $(id).setAttribute('transform', `translate(${cx + off(x)} ${cy + off(y)})`);
    }

    let pairBusyUntil = 0;   // after a press the button waits for the state to catch up

    function renderBt(bt) {
      if (!bt) return;
      const ready = bt.state === 'ready', pairing = ready && bt.pairing_left > 0;
      $('btPill').textContent = T.btState[bt.state] || bt.state;
      $('vBtAdapter').textContent = bt.adapter || '—';
      $('vBtAddr').textContent = bt.address || '—';
      $('vBtPaired').textContent = ready ? String(bt.paired) : '—';
      $('vBtPads').textContent = bt.pads.length ? bt.pads.map(p => `${p.name} · slot ${p.slot}`).join(', ') : '—';
      $('btNote').textContent = bt.state === 'no adapter' ? T.btNoAdapter : pairing ? T.btPairing(bt.pairing_left) : T.btIdle;
      /* Rewriting a button 30 times a second can swallow a press on the console's browser */
      const busy = performance.now() < pairBusyUntil;
      setText($('btnBtPair'), busy ? T.btWait : pairing ? T.btCancel : T.btPair);
      if ($('btnBtPair').disabled !== (!ready || busy)) $('btnBtPair').disabled = !ready || busy;
      if ($('btnBtForget').disabled !== (!ready || bt.paired === 0)) $('btnBtForget').disabled = !ready || bt.paired === 0;
    }

    /* Only touches the page when the value changes */
    function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

    function renderBattery(el, s) {
      const known = s && s.battery_known;
      const key = known ? `${s.battery}|${s.charging}` : '';
      if (el.dataset.key === key) return;
      el.dataset.key = key;
      if (!known) { el.innerHTML = ''; el.className = 'bat'; return; }
      el.className = 'bat' + (s.charging ? ' chg' : s.battery <= 20 ? ' low' : '');
      el.innerHTML = `<span class="cell"><i style="width:${Math.min(100, s.battery)}%"></i></span>${s.charging ? '⚡' : ''}${s.battery}%`;
    }

    function renderStatus(d) {
      const used = d.slots.filter(s => s.status !== ST_FREE).length;
      $('stLed').className = 'led ok';
      $('stText').textContent = T.stOn;
      $('stPads').textContent = T.pads(used);
      $('stBt').textContent = d.bt ? (T.btShort[d.bt.state] || d.bt.state) : '';
      $('stBt').style.display = d.bt ? '' : 'none';
      $('start').style.display = used ? 'none' : '';
    }

    function render(d) {
      renderBt(d.bt);
      renderStatus(d);
      $('ver').textContent = `v${d.version} · build ${d.build} · ${T.up} ${fmtDur(d.uptime_ms)}`;
      $('foot').textContent = `OmniPad CE v${d.version} (build ${d.build})`;

      d.slots.forEach((s, i) => {
        const b = $(`slot${i}`);
        const free = s.status === ST_FREE;
        b.classList.toggle('free', free);
        b.setAttribute('aria-selected', String(i === selected));
        // the log numbers slots from 0; phones only show the short form
        b.querySelector('.pl').innerHTML = `<span class="long">${T.player} ${i + 2} · slot ${i}</span><span class="short">P${i + 2}</span>`;
        b.querySelector('.led').className = 'led ' + slotLed(s);
        b.querySelector('.nm').textContent = free ? T.free : (s.name || T.controller);
        b.querySelector('.sub').textContent = free ? T.waiting : `${connName(s.conn)} · ${T.st[s.status] || ''}`;
        renderBattery(b.querySelector('.bat'), free ? null : s);
      });

      const s = d.slots[selected] || d.slots[0];
      if (mapWait) mapTick(s);
      renderRemap(s);
      const free = s.status === ST_FREE;
      const gotInput = s.input_age_ms >= 0;
      const live = !free && gotInput;  // until the first report the pad is drawn at rest

      $('slotPill').textContent = `${T.player} ${selected + 2}`;
      $('padWrap').classList.toggle('idle', !live);
      $('padHint').textContent = free ? T.hintFree : T.hintWait;
      ['lb-l', 'lb-r'].forEach(id => $(id).classList.toggle('lit', s.status === ST_READY));

      const btn = live ? s.buttons >>> 0 : 0;
      BTN.forEach(([k, bit]) => setKey(`k-${k}`, (btn & bit) !== 0));
      ['tri', 'cir', 'crs', 'sqr'].forEach(k => $(`f-${k}`).classList.toggle('on', $(`k-${k}`).classList.contains('on')));
      setKey('s-l', (btn & (1 << 1)) !== 0); setKey('s-r', (btn & (1 << 2)) !== 0);

      const lx = live ? s.lx : 128, ly = live ? s.ly : 128, rx = live ? s.rx : 128, ry = live ? s.ry : 128;
      const l2 = live ? s.l2 : 0, r2 = live ? s.r2 : 0;
      moveStick('s-l', STICK_L, lx, ly); moveStick('s-r', STICK_R, rx, ry);
      const off = (v) => ((v - 128) / 128);
      $('m-l').setAttribute('cx', 42 + off(lx) * 33); $('m-l').setAttribute('cy', 42 + off(ly) * 33);
      $('m-r').setAttribute('cx', 42 + off(rx) * 33); $('m-r').setAttribute('cy', 42 + off(ry) * 33);
      $('t-l2').setAttribute('width', TRIG_W * l2 / 255); $('t-r2').setAttribute('width', TRIG_W * r2 / 255);
      $('v-lx').textContent = lx; $('v-ly').textContent = ly; $('v-rx').textContent = rx; $('v-ry').textContent = ry;
      $('v-l2').textContent = l2; $('v-r2').textContent = r2;
      $('b-l2').style.width = `${l2 / 2.55}%`; $('b-r2').style.width = `${r2 / 2.55}%`;

      const pressed = BTN.filter(([, bit]) => btn & bit).map(([, , label]) => label);
      const chips = $('chips');
      const sig = lang + pressed.join('|');
      if (chips.dataset.sig !== sig) {
        chips.dataset.sig = sig;
        chips.innerHTML = '';
        if (!pressed.length) {
          const n = document.createElement('span'); n.className = 'none'; n.textContent = T.none; chips.appendChild(n);
        } else pressed.forEach(p => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = p; chips.appendChild(c); });
      }

      // health
      const r = rate(selected, 'inputs'), inj = rate(selected, 'injected');
      $('vRate').textContent = free || r == null ? '—' : Math.round(r);
      $('vInj').textContent = free || inj == null ? '—' : Math.round(inj);
      $('vInj').className = 'v' + (free || inj == null ? '' : (s.status === ST_READY ? (inj >= 200 ? ' ok' : ' warn') : ''));
      $('vAge').innerHTML = free ? '—' : (gotInput ? `${fmtDur(s.input_age_ms)} <small>${T.ago}</small>` : T.never);
      $('vUp').textContent = free ? '—' : fmtDur(s.connected_ms);
      $('vConn').textContent = free ? '—' : connName(s.conn);
      setText($('vBat'), free ? '—' : !s.battery_known ? T.batUnknown : `${s.battery}%${s.charging ? ` (${T.batCharging})` : ''}`);
      $('vId').textContent = free || (!s.vid && !s.pid) ? '—' : `${hex4(s.vid)}:${hex4(s.pid)}`;
      $('vState').textContent = T.st[s.status] || '—';
      $('vState').className = 'v ' + ({ 3: 'ok', 1: 'warn', 2: 'warn', 4: 'bad' }[s.status] || '');

      const note = $('idleNote');
      const idleS = gotInput ? Math.floor(s.input_age_ms / 1000) : 0;
      const limS = Math.round((s.idle_release_ms || 0) / 1000);
      if (!free && limS > 0 && s.status === ST_READY && idleS >= 10) {
        note.className = 'note warn'; note.textContent = T.idle(idleS, limS);
      } else if (!free && gotInput && r === 0) {
        note.className = 'note'; note.textContent = T.quiet;
      } else { note.className = 'note'; note.textContent = ''; }

      $('btnPS').disabled = s.status !== ST_READY;
      $('btnDrop').disabled = free;
    }

    /* ---------- polling ---------- */
    function setLink(state) {
      $('linkLed').className = 'led ' + state;
      $('linkText').textContent = state === 'ok' ? T.linkOk : state === 'bad' ? T.linkBad : T.linkWait;
      $('offline').classList.toggle('show', state === 'bad');
      if (state === 'bad') { $('stLed').className = 'led bad'; $('stText').textContent = T.stOff; }
    }

    let lastOk = performance.now();

    async function pollState() {
      if (document.hidden) { setTimeout(pollState, 500); return; }
      const t0 = performance.now();
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 2000); // an unreachable PS5 can hang a request for a long time
      try {
        const res = await fetch('/api/state', { cache: 'no-store', signal: abort.signal });
        if (!res.ok) throw new Error(res.status);
        const d = await res.json();
        const t = performance.now();
        d.slots.forEach((s, i) => pushHist(i, t, s));
        const first = !last;
        last = d; failures = 0; lastOk = t; setLink('ok');
        if (first) checkUpdate();
        if (langFollowsConsole && I18N[d.lang]) {
          langFollowsConsole = false;
          if (d.lang !== lang) { lang = d.lang; applyLang(); }
        }
        render(d);
      } catch (e) {
        failures++;
        setLink(performance.now() - lastOk > 4000 ? 'bad' : 'warn');
      } finally {
        clearTimeout(timer);
      }
      const spent = performance.now() - t0;
      setTimeout(pollState, failures ? 1000 : Math.max(0, STATE_EVERY_MS - spent));
    }

    /* ---------- log ---------- */
    let logLines = [];
    let logOffset = null;
    let logPaused = false;
    let quick = 'all';
    const QUICK = {
      all: null,
      usb: /usb_hotplug|usb_ctrl|ugen|VID|dongle|player LED/i,
      bt: /bt:|pad [0-9A-F]{2}:|pairing|inquiry|controller|link |le:/,
      slot: /vpad:|slot \d|AddDevice|released|releasing|re-arming|profile|ready|removed/i,
      err: /error|fail|disconnect|unparsed|timeout|warning|idle for/i
    };

    function buildQuick() {
      const box = $('quick');
      box.innerHTML = '';
      [['all', T.qAll], ['usb', T.qUsb], ['bt', 'Bluetooth'], ['slot', T.qSlot], ['err', T.qErr]].forEach(([k, label]) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ghost'; b.textContent = label;
        b.setAttribute('aria-pressed', String(k === quick));
        b.addEventListener('click', () => { quick = k; buildQuick(); renderLog(); });
        box.appendChild(b);
      });
    }

    function classify(line) {
      if (/error|fail|disconnected|unparsed/i.test(line)) return 'e';
      if (/idle|releasing|warning|pending|0x803b0006/i.test(line)) return 'w';
      if (/ready|claimed|sent on OUT|Active|initialized/i.test(line)) return 'g';
      return '';
    }

    function renderLog() {
      const pre = $('log');
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
      const text = $('logFilter').value.trim().toLowerCase();
      const rx = QUICK[quick];
      const frag = document.createDocumentFragment();
      let shown = 0;
      for (const line of logLines) {
        if (rx && !rx.test(line)) continue;
        if (text && !line.toLowerCase().includes(text)) continue;
        const m = /^(\[[^\]]+\]) ?(.*)$/.exec(line);
        const row = document.createElement('div');
        if (m) {
          const ts = document.createElement('span'); ts.className = 't'; ts.textContent = m[1] + ' ';
          const body = document.createElement('span'); body.className = classify(m[2]); body.textContent = m[2];
          row.append(ts, body);
        } else row.textContent = line;
        frag.appendChild(row);
        shown++;
      }
      pre.replaceChildren(frag);
      $('logCount').textContent = String(shown);
      if (atBottom && !logPaused) pre.scrollTop = pre.scrollHeight;
    }

    async function pollLog() {
      if (!document.hidden && !logPaused) {
        try {
          const url = logOffset == null ? '/api/log' : `/api/log?since=${logOffset}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const body = await res.text();
            const next = Number(res.headers.get('X-Log-Offset'));
            if (logOffset != null && Number.isFinite(next) && next < logOffset) logLines = []; // log file was replaced
            if (Number.isFinite(next)) logOffset = next;
            const fresh = body.split('\n').filter(Boolean);
            if (fresh.length) {
              logLines = logLines.concat(fresh).slice(-MAX_LOG_LINES);
              renderLog();
            }
          }
        } catch (e) { /* the state poll already reports the link */ }
      }
      setTimeout(pollLog, LOG_EVERY_MS);
    }

    /* ---------- update check ---------- */
    /* Asks GitHub for the latest release at most every 6 hours (its API allows 60 requests an
     * hour per address) and shows a banner when it is newer than the running build */
    const RELEASES_API = 'https://api.github.com/repos/jpemendonca/OmniPad-CE/releases/latest';
    const UPDATE_EVERY_MS = 6 * 3600 * 1000;
    let latest = null;   // { tag, url }

    function verParts(v) {
      const m = String(v || '').match(/(\d+)\.(\d+)\.(\d+)/);
      return m ? m.slice(1, 4).map(Number) : null;
    }
    function isNewer(a, b) {
      if (!a || !b) return false;
      for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i];
      return false;
    }
    function renderUpdate() {
      const show = latest && last && isNewer(verParts(latest.tag), verParts(last.version));
      $('update').classList.toggle('show', !!show);
      if (!show) return;
      $('updText').textContent = T.upd(latest.tag);
      $('updLink').textContent = T.updLink;
      $('updLink').href = latest.url;
    }
    async function checkUpdate() {
      try {
        const saved = JSON.parse(load('omnipad.latest', 'null'));
        if (saved && Date.now() - saved.at < UPDATE_EVERY_MS) latest = saved;
      } catch (e) { /* nothing saved */ }
      if (!latest) {
        try {
          const res = await fetch(RELEASES_API, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
          if (res.ok) {
            const j = await res.json();
            latest = { tag: j.tag_name, url: j.html_url, at: Date.now() };
            save('omnipad.latest', JSON.stringify(latest));
          }
        } catch (e) { /* no internet: no banner */ }
      }
      renderUpdate();
    }

    /* ---------- diagnostics ---------- */
    /* Version, slots, remaps and Bluetooth, as lines */
    function diagLines() {
      const d = last || { slots: [] };
      const lines = [`OmniPad ${d.version || '?'} build ${d.build || '?'}, up ${fmtDur(d.uptime_ms)}`];
      d.slots.forEach((s, i) => lines.push(`P${i + 2}: ` + (s.status === ST_FREE ? 'free'
        : `${s.name} | ${connName(s.conn)} | ${T.st[s.status] || s.status} | ${hex4(s.vid)}:${hex4(s.pid)} | last report ${fmtDur(s.input_age_ms)} | battery ${s.battery_known ? s.battery + '%' : 'not reported'}`)));
      Object.keys(remapRules).forEach(k => lines.push(`Remap ${k.split(':').map(hex4).join(':')}: ${remapRules[k]}`));
      if (d.bt) lines.push(`Bluetooth: ${d.bt.state} | ${d.bt.adapter || '-'} | ${d.bt.address || '-'} | paired ${d.bt.paired} | connected ${d.bt.pads.length}`);
      lines.push(`Browser: ${navigator.userAgent}`);
      return lines;
    }

    /* Version, slots, Bluetooth and the end of the log in one text, to paste when asking for help */
    async function copyDiag() {
      let log = '';
      try { log = await (await fetch('/api/log', { cache: 'no-store' })).text(); } catch (e) { log = '(log unavailable)'; }
      const lines = diagLines();
      lines.push('', '--- log (last 150 lines) ---', log.split('\n').slice(-150).join('\n'));
      const text = lines.join('\n');
      const box = $('diagText');
      box.value = text;
      $('diagBox').classList.add('show');
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* not on plain http */ }
      if (!ok) {
        try { box.focus(); box.select(); ok = document.execCommand('copy'); } catch (e) { /* select by hand */ }
      }
      $('diagNote').textContent = ok ? T.diagCopied : T.diagManual;
    }

    /* ---------- report: sent only when the person presses Send (omnipad-diagnostics CONTRACT.md) ---------- */
    const REPORT_API = 'https://omnipad-diagnostics.omnipad-diagnostics.workers.dev/v1/reports';
    const REPORT_LOG_MAX = 200 * 1024, REPORT_MSG_MAX = 2048, REPORT_TRIES = 3;
    let reportBusy = false, reportDone = false;   /* sent: Send stays off until the panel is opened again */
    const utf8 = new TextEncoder();

    function byteLen(s) { return utf8.encode(s).length; }
    /* The first max bytes, never splitting a character */
    function keepStart(s, max) {
      if (byteLen(s) <= max) return s;
      return new TextDecoder().decode(utf8.encode(s).slice(0, max)).replace(/�+$/, '');
    }
    /* The last max bytes, from a whole line */
    function keepEnd(s, max) {
      if (byteLen(s) <= max) return s;
      const tail = new TextDecoder().decode(utf8.encode(s).slice(-max));
      const nl = tail.indexOf('\n');
      return nl >= 0 ? tail.slice(nl + 1) : tail;
    }
    /* The end of the log, up to max bytes, read in the 32 KB pages /api/log serves */
    async function reportLog(max) {
      const first = await fetch('/api/log', { cache: 'no-store' });
      const firstText = await first.text();
      const end = Number(first.headers.get('X-Log-Offset')) || 0;
      if (end <= byteLen(firstText)) return keepEnd(firstText, max);
      const from = Math.max(0, end - max);
      let at = from, text = '';
      while (at < end) {
        const res = await fetch(`/api/log?since=${at}`, { cache: 'no-store' });
        const chunk = await res.text();
        const next = Number(res.headers.get('X-Log-Offset')) || at;
        if (!chunk || next <= at) break;
        text += chunk;
        at = next;
      }
      if (from > 0) text = text.slice(text.indexOf('\n') + 1);   /* the first line starts before `from` */
      return keepEnd(text, max);
    }
    function logFirmware(log) {
      const all = [...log.matchAll(/raw FW version 0x[0-9a-f]+ \(([0-9.]+)\)/g)];
      return all.length ? all[all.length - 1][1] : '';
    }
    function reportSay(text, kind) {
      $('reportStatus').textContent = text;
      $('reportStatus').className = 'note report-msg' + (kind ? ' ' + kind : '');
    }
    function openReport() {
      $('reportBox').classList.add('show');
      reportDone = false;
      $('btnReportSend').disabled = false;
      reportSay('', '');
      $('reportBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('reportMsg').focus({ preventScroll: true });
    }
    async function previewReport() {
      if (!$('reportDetails').open) return;
      let log = '';
      try { log = await reportLog(REPORT_LOG_MAX); } catch (e) { log = ''; }
      $('reportPreviewText').value = diagLines().join('\n') + '\n\n' + T.reportLogSize(Math.ceil(byteLen(log) / 1024)) + '\n'
        + log.split('\n').slice(-60).join('\n');
    }
    async function sendReport() {
      if (reportBusy || reportDone) return;
      reportBusy = true;
      $('btnReportSend').disabled = true;
      reportSay(T.reportSending, '');
      try {
        let log = '';
        try { log = await reportLog(REPORT_LOG_MAX); } catch (e) { log = ''; }
        const body = {
          log,
          diagnostics: diagLines().join('\n'),
          version: String((last && last.version) || ''),
          build: String((last && last.build) || ''),
          firmware: logFirmware(log),
          message: keepStart($('reportMsg').value.trim(), REPORT_MSG_MAX),
        };
        for (let i = 0; i < REPORT_TRIES; i++) {
          const res = await fetch(REPORT_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body) });
          let data = {};
          try { data = await res.json(); } catch (e) { /* no JSON body */ }
          if (res.status === 201 && data.code) {
            reportSay(T.reportSent(data.code), 'ok');
            reportDone = true;
            $('reportMsg').value = '';
            return;
          }
          if (res.status === 413 && body.log) {   /* too big: keep the newer half of the log */
            body.log = keepEnd(body.log, Math.floor(byteLen(body.log) / 2));
            continue;
          }
          reportSay(res.status === 429 ? T.reportLater : data.error === 'daily_limit' ? T.reportTomorrow : T.reportFail, 'bad');
          return;
        }
        reportSay(T.reportFail, 'bad');
      } catch (e) {
        reportSay(T.reportFail, 'bad');   /* no internet, or the browser blocked the request */
      } finally {
        reportBusy = false;
        $('btnReportSend').disabled = reportDone;
      }
    }

    /* ---------- actions ---------- */
    async function post(path) {
      try { await fetch(path, { method: 'POST' }); } catch (e) { /* surfaced by the link indicator */ }
    }

    function wire() {
      Object.entries(LANG_NAMES).forEach(([code, name]) => $('langSel').add(new Option(name, code)));
      $('langSel').addEventListener('change', e => {
        lang = e.target.value; langFollowsConsole = false; save('omnipad.lang', lang); applyLang();
      });
      document.querySelectorAll('#themeSeg [data-set-theme]').forEach(b => b.addEventListener('click', () => {
        theme = b.dataset.setTheme; save('omnipad.theme', theme); applyTheme();
      }));
      $('btnPS').addEventListener('click', () => post(`/api/press_ps?slot=${selected}`));
      $('btnDrop').addEventListener('click', () => post(`/api/disconnect?slot=${selected}`));
      $('btnDropAll').addEventListener('click', () => { if (confirm(T.confirmDropAll)) post('/api/disconnect?slot=-1'); });
      $('btnStop').addEventListener('click', () => { if (confirm(T.confirmStop)) post('/api/exit'); });
      $('btnBtPair').addEventListener('click', () => {
        const pairing = last && last.bt && last.bt.pairing_left > 0;
        pairBusyUntil = performance.now() + 1200;   // a second press must not close what this one opened
        post(`/api/pair?seconds=${pairing ? 0 : 120}`);
        if (last) renderBt(last.bt);
      });
      $('btnBtForget').addEventListener('click', () => { if (confirm(T.confirmForget)) post('/api/bt_forget'); });
      $('btnDiag').addEventListener('click', copyDiag);
      $('btnReport').addEventListener('click', openReport);
      $('btnReportClose').addEventListener('click', () => $('reportBox').classList.remove('show'));
      $('btnReportSend').addEventListener('click', sendReport);
      $('reportDetails').addEventListener('toggle', previewReport);
      $('btnMap').addEventListener('click', toggleMapping);
      const pad = document.querySelector('svg.pad');
      pad.addEventListener('click', e => {
        const el = e.target.closest('.hit');
        if (el && mapOn) mapAsk(el.dataset.map);
      });
      pad.addEventListener('pointerover', e => {
        const el = e.target.closest('.hit');
        setMapHover(el && e.pointerType !== 'touch' ? el.dataset.map : '');
      });
      pad.addEventListener('pointerleave', () => setMapHover(''));
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && mapWait) { mapCancel(); mapSay(''); refreshRemap(); }
      });
      $('logFilter').addEventListener('input', renderLog);
      $('btnPause').addEventListener('click', () => { logPaused = !logPaused; $('btnPause').textContent = logPaused ? T.resume : T.pause; if (!logPaused) renderLog(); });
      $('btnClear').addEventListener('click', () => { logLines = []; renderLog(); });
    }

    buildSlots();
    buildMapTargets();
    wire();
    applyTheme();
    applyLang();
    setLink('');
    pollState();
    pollLog();
    loadRemap();
  })();
  </script>
</body>
</html>
